openapi: 3.0.3

info:
  title: Federal Business Profile API
  version: 0.1.0
  description: >
    A public-data API that combines federal business-registration
    information and federal award-history information into one
    business profile.

servers:
  - url: https://api.example.com
    description: Placeholder production URL
  - url: http://localhost:8080
    description: Local development URL

paths:
  /api/businesses/{uei}:
    get:
      summary: Get a combined federal business profile
      description: >
        Returns available entity-registration and federal award-history
        information for a business identified by its UEI. If one
        upstream source is temporarily unavailable, the response
        identifies the unavailable section and does not present the
        partial profile as complete.
      parameters:
        - name: uei
          in: path
          required: true
          description: A 12-character alphanumeric Unique Entity Identifier.
          schema:
            type: string
            pattern: '^[A-Za-z0-9]{12}$'
      responses:
        '200':
          description: A business profile was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProfile'
              examples:
                completeProfile:
                  summary: Both upstream sources returned data
                  value:
                    uei: ABCD1234EFGH
                    legalName: Example Federal Services LLC
                    registrationStatus: Active
                    physicalAddress: 123 Example Street, Washington, DC 20001
                    certifications:
                      - HUBZone
                      - Women-Owned Small Business
                    awards:
                      - awardId: 47QRAA20D0001
                        title: Information Technology Support Services
                        recipientName: Example Federal Services LLC
                        awardingAgency: General Services Administration
                        awardType: Definitive Contract
                        amount: 1250000.00
                        startDate: '2025-10-01'
                        endDate: '2026-09-30'
                    sourceStatus:
                      samGov:
                        available: true
                      usaSpending:
                        available: true

                partialProfileSamGovUnavailable:
                  summary: Award history is available; SAM.gov data is unavailable
                  value:
                    uei: ABCD1234EFGH
                    legalName: Example Federal Services LLC
                    awards:
                      - awardId: 47QRAA20D0001
                        title: Information Technology Support Services
                        recipientName: Example Federal Services LLC
                        awardingAgency: General Services Administration
                        awardType: Definitive Contract
                        amount: 1250000.00
                        startDate: '2025-10-01'
                        endDate: '2026-09-30'
                    sourceStatus:
                      samGov:
                        available: false
                        message: SAM.gov data is temporarily unavailable.
                      usaSpending:
                        available: true

                partialProfileUsaSpendingUnavailable:
                  summary: Registration data is available; USAspending data is unavailable
                  value:
                    uei: ABCD1234EFGH
                    legalName: Example Federal Services LLC
                    registrationStatus: Active
                    physicalAddress: 123 Example Street, Washington, DC 20001
                    certifications:
                      - HUBZone
                      - Women-Owned Small Business
                    awards: []
                    sourceStatus:
                      samGov:
                        available: true
                      usaSpending:
                        available: false
                        message: USAspending data is temporarily unavailable.
                
                      

        '400':
          description: The UEI does not have the required format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 400
                code: INVALID_UEI
                message: UEI must contain exactly 12 alphanumeric characters.

        '404':
          description: No business profile was found for the UEI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 404
                code: BUSINESS_NOT_FOUND
                message: No business profile was found for the supplied UEI.

        '502':
          description: >
            The profile could not be returned because required upstream
            public-data services were unavailable or returned an invalid
            response. Partial profile responses are returned with 200 instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                status: 502
                code: UPSTREAM_SERVICE_UNAVAILABLE
                message: SAM.gov data is temporarily unavailable. Available profile data is included when possible.
components:
  schemas:
    BusinessProfile:
      type: object
      required:
        - uei
        - legalName
      properties:
        uei:
          type: string
          description: The business's 12-character Unique Entity Identifier.
          example: ABCD1234EFGH

        legalName:
          type: string
          description: The business's legal name from available registration data.
          example: Example Federal Services LLC

        registrationStatus:
          type: string
          description: Registration status when available from SAM.gov.
          example: Active

        physicalAddress:
          type: string
          description: Physical business address when available from SAM.gov.
          example: 123 Example Street, Washington, DC 20001

        certifications:
          type: array
          description: Available socioeconomic certifications or business types.
          items:
            type: string
          example:
            - HUBZone
            - Women-Owned Small Business

        awards:
          type: array
          description: High-level federal award history when available from USAspending.
          items:
            $ref: '#/components/schemas/AwardSummary'

        sourceStatus:
          $ref: '#/components/schemas/SourceStatus'

    Error:
      type: object
      required:
        - status
        - code
        - message
      properties:
        status:
          type: integer
          description: HTTP status code returned by this API.
          example: 400

        code:
          type: string
          description: Application-specific, stable error code.
          example: INVALID_UEI

        message:
          type: string
          description: Human-readable explanation of the problem.
          example: UEI must contain exactly 12 alphanumeric characters.

    AwardSummary:
      type: object
      required:
        - awardId
        - recipientName
      properties:
        awardId:
          type: string
          description: Identifier for the federal award.
          example: 47QRAA20D0001

        title:
          type: string
          description: Award title or description when available.
          example: Information Technology Support Services

        recipientName:
          type: string
          description: Recipient name reported by USAspending.
          example: Example Federal Services LLC

        awardingAgency:
          type: string
          description: Federal agency that issued the award when available.
          example: General Services Administration

        awardType:
          type: string
          description: Type of federal award when available.
          example: Definitive Contract

        amount:
          type: number
          format: double
          description: Award amount when available.
          example: 1250000.00

        startDate:
          type: string
          format: date
          description: Award start date when available.
          example: '2025-10-01'

        endDate:
          type: string
          format: date
          description: Award end date when available.
          example: '2026-09-30'

    SourceStatus:
      type: object
      required:
        - samGov
        - usaSpending
      properties:
        samGov:
          $ref: '#/components/schemas/SourceAvailability'

        usaSpending:
          $ref: '#/components/schemas/SourceAvailability'

    SourceAvailability:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
          description: Whether data from this source was available for this response.
          example: true

        message:
          type: string
          description: A user-safe explanation when source data is unavailable.
          example: SAM.gov data is temporarily unavailable.
